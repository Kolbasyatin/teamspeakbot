name: Build Docker Images

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service to build"
        required: true
        default: "monitor"
        type: choice
        options:
          - monitor

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-monitor:
    name: Build monitor image
    runs-on: ubuntu-latest
    if: ${{ inputs.service == 'monitor' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./teamSpeakMonitoring
          file: ./teamSpeakMonitoring/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.repository }}/tsbot-monitor:latest
            ghcr.io/${{ steps.image.outputs.repository }}/tsbot-monitor:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
