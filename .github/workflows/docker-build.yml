# Собирает образ tsbot-monitor и публикует в GHCR.
#
# Запускается сам при push в master, если менялось приложение или этот файл; остальное
# (документация, .docker/, http-файлы) образ не меняет и сборку не запускает.
# Ручной запуск (workflow_dispatch) оставлен для пересборки без коммита.
#
# Перед сборкой — typecheck и unit-тесты: образ с красными тестами в GHCR попадать не должен.
# Интеграционные тесты (нужна MariaDB) здесь не гоняются.
#
# Теги: latest и sha-<полный SHA коммита> — по SHA можно откатиться, поменяв тег в compose.prod.yaml.

name: Build Docker Images

on:
  push:
    branches: [master]
    paths:
      - "teamSpeakMonitoring/**"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-monitor:
    name: Build monitor image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: teamSpeakMonitoring/package-lock.json

      - name: Install dependencies
        working-directory: teamSpeakMonitoring
        run: npm ci

      - name: Typecheck and unit tests
        working-directory: teamSpeakMonitoring
        # pretest:unit запускает typecheck сам, отдельного шага не нужно.
        run: npm run test:unit

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        # GHCR требует имя в нижнем регистре, а GITHUB_REPOSITORY сохраняет регистр владельца.
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./teamSpeakMonitoring
          file: ./teamSpeakMonitoring/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.repository }}/tsbot-monitor:latest
            ghcr.io/${{ steps.image.outputs.repository }}/tsbot-monitor:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
